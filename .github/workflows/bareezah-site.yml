# Publishes the Bareezah Solutions static site (sites/bareezah-solutions) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Actions are pinned to full commit SHAs (supply-chain safety); the comment shows the release tag.
name: Bareezah site

on:
  push:
    branches: [main]
    paths:
      - "sites/bareezah-solutions/**"
      - ".github/workflows/bareezah-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bareezah-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: sites/bareezah-solutions
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
